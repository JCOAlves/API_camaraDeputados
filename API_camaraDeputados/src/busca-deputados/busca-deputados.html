<table class="w-300 mr-auto ml-auto">
    <tr class="bg-blue-100 border">
        <th class="p-5">Foto</th>
        <th class="w-60 p-5">Nome</th>
        <th class="w-80 p-5">Email</th>
        <th class="p-5">Partido</th>
        <th class="w-18 p-5">UF</th>
    </tr>
    @for (item of deputados(); track item.id) {
        <tr class="border">
            <th class=""><img class="w-30" [src]="item.urlFoto" alt="Foto deputado" width="50"></th>
            <th class="p-5">{{item.nome}}</th>
            <th class="p-5">{{item.email}}</th>
            <th class="p-5">{{item.siglaPartido}}</th>
            <th>{{item.siglaUf}}</th>
        </tr>
    }
</table>
